method: probed
source: https://platform.gist.ai/mcp
name: Gist Developer Hub MCP
description: >-
  ProRata serves a remote MCP endpoint on its own developer-hub host, platform.gist.ai.
  A GET returns the plain-text guard "This URL can only be accessed with a MCP client."
  and a JSON-RPC POST is answered by a real MCP server, so the surface exists and is
  reachable — but it is authorization-gated, so its live tool list could not be read.
deployment:
  mode: remote
  endpoint: https://platform.gist.ai/mcp
  install: null
  package: null
  auth: oauth
  verified: probed
