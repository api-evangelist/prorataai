openapi: 3.2.0
info:
  title: Prorata API Service Health API
  version: 1.0.0
  description: API for chat, threads, questions, and publisher management
servers:
- url: /v1
  description: API v1
tags:
- name: Health
paths:
  /v1/health:
    get:
      tags:
      - Health
      summary: Get detailed service health status
      description: '**Public Endpoint**: This endpoint is publicly accessible and does not require authentication.

        Returns detailed health status of the service and its dependencies.

        '
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - timestamp
                - uptime
                - services
                properties:
                  status:
                    type: string
                    enum:
                    - healthy
                    - unhealthy
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
                    example: '2024-02-05T16:42:28.232Z'
                  uptime:
                    type: number
                    example: 12.415816542
                  services:
                    type: object
                    properties:
                      database:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                            - operational
                            - failed
                      redis:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                            - operational
                            - failed
                      inference:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                            - operational
                            - failed
                          error:
                            type: string
                            example: fetch failed
                      publishers:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                            - operational
                            - failed
                      questions:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                            - operational
                            - failed
        '500':
          description: Internal server error
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Add your API key with the Bearer prefix (e.g., "Bearer YOUR-API-KEY")
