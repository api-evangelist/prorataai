aid: prorataai
name: ProRata.ai
description: 'ProRata.ai is an AI attribution, search and advertising company founded
  in 2024 by Idealab founder Bill Gross. It operates the Gist family of products —
  Gist Answers (an embeddable, publisher-hosted AI answer widget), Gist Content Network
  (a licensed publisher content corpus with revenue share), Gist Ads (advertising placed
  inside AI answer surfaces) and Gist GEO (generative-engine-optimization visibility
  tracking). Its developer surface is the Gist Developer Hub at platform.gist.ai, which
  publishes a public OpenAPI 3.0 contract — the "Prorata API Service" — covering chat,
  streaming completions, citations and attributions, threads, recommended and related
  questions, document summarization, publisher lookup and service health, served from
  https://api.gist.ai behind a Bearer API key issued at the Publisher Group level.'
