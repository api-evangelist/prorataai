apis:
- aid: prorataai-gist-content-api
  name: Gist Content API (Ingest)
  description: >-
    The publisher ingest API for the Gist Content Network. Publisher partners push articles to ProRata
    in real time (POST /ingest/article) or in bulk for archived content (POST /ingest/multiple_articles),
    authenticated with a Publisher Group Bearer API key. The published documentation states a default
    rate limit of 10 requests per minute and documents 400/401/429/500 error semantics. ProRata does not
    publish an OpenAPI contract for this surface; the docs give relative endpoint paths only.
  humanURL: https://platform.gist.ai/docs/gist-content-api
  baseURL: https://api.gist.ai
  tags:
