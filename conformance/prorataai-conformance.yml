domain_standards:
- id: content-telemetry
  name: Content Telemetry (SPUR Coalition)
  role: contributor
  conforms: false
  contract_declares: false
  evidence: >-
    ProRata publicly authored and published, under Apache-2.0 on its own GitHub org, a
    proposed extension to the SPUR Coalition Content Telemetry standard — "Fractional
    attribution extension", status "proposal draft (v2026-07-13) ... contributed by
    ProRata for public comment. Not adopted by the SPUR Coalition." It ships an object
    model, RFC-style conformance rules, a conduct/disclosure profile and three JSON
    Schemas (draft 2020-12): attribution-extension.json, attribution-report.json,
    attribution-session-strict.json, with the core session schema vendored verbatim.
  contract_gap: >-
    RECORDED AS NON-CONFORMING ON PURPOSE. The shipped API does NOT emit the format.
    GET /v1/chat/attributions/{threadId}/{turnId} returns a vendor-specific shape —
    credit_dist / domain_credit_dist / document_credit_dist / publisher_credit_dist, each
    a bare map of identifier to percentage — with no extension identifier, no estimator
    id/version, no model_residual and no granularity. The extension's own example uses
    the estimator id "ai.prorata.gist-fa", so the two are plainly related, but the public
    contract carries none of the standard's carrier fields. A buyer who already speaks
    Content Telemetry still needs a bespoke connector for this API.
  source: https://github.com/prorata-ai/content-telemetry-attribution
- id: content-signals
  name: Content Signals (robots.txt Content-Signal directive)
  conforms: partial
  evidence: >-
    prorata.ai's robots.txt carries a full Content Signals preamble and
    "Content-Signal: search=yes,ai-train=no,use=reference" plus per-bot Disallow blocks
    for Amazonbot, Applebot-Extended and Bytespider. The block is explicitly labelled
    "BEGIN Cloudflare Managed content", so it is an edge-provider default rather than a
    hand-authored ProRata declaration, and is recorded as such. gist.ai's robots.txt
    carries only a Sitemap line and no content signals at all.
  source: https://prorata.ai/robots.txt
